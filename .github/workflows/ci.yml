name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://finance:finance@127.0.0.1:5433/finance_test

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar dependências
        working-directory: backend
        run: uv sync --locked

      - name: Lint, tipos e testes
        run: bash scripts/check.sh

  frontend:
    name: Frontend (tipos, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Tipos, testes e build
        run: npm run check

  deploy:
    name: Publicar no Fly.io
    # Só a main, só depois das checagens; PRs nunca publicam.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Um deploy em andamento nunca é cancelado por outro push.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Instalar flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Publicar
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Conferir que o app respondeu
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "https://financas-pessoais.fly.dev/api/v1/health"
